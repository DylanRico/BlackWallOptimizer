openapi: 3.0.3
info:
  title: Blackwall signed OTA distribution fixtures
  version: 1.0.0
paths:
  /manifest:
    get:
      responses:
        '200':
          description: RSA-SHA256 envelope, payload and signature encoded in base64; exact signed bytes are authoritative.
  /binary:
    get:
      responses:
        '200':
          description: Immutable managed PE matching the signed SHA256, version and byte size.
  /failure:
    get:
      responses:
        '500':
          description: Distribution failure, must not mutate the installation.
