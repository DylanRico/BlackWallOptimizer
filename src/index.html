<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Blackwall — Muro Negro</title>
  <link rel="icon" href="./blackwall-mark.png" type="image/png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- BARRA SUPERIOR CON BUSCADOR CENTRAL (OMNIBOX CTRL+K) Y TEMA -->
  <header class="top-header">
    <svg class="blackwall-filament" viewBox="0 0 180 10" aria-hidden="true"><path d="M0 8h40l8-6h30l10 6h44l8-4h40" /></svg>
    <div class="brand-box">
      <img class="brand-logo" src="./blackwall-mark.png" alt="" width="42" height="42" />
      <div>
        <div class="brand-title">BLACKWALL</div>
        <div class="brand-subtitle">
          <span id="device-badge-pill">SYSTEM CONTROL / WINDOWS</span>
        </div>
      </div>
    </div>

    <!-- BUSCADOR GLOBAL CENTRADO (OMNIBOX) -->
    <div class="omnibox-wrapper">
      <span class="omnibox-icon" aria-hidden="true">⌕</span>
      <input
        id="omnibox-input"
        type="text"
        class="omnibox-input"
        placeholder="Buscar hardware, ajustes o software…"
        aria-label="Buscar en Blackwall"
        autocomplete="off"
      />
      <span class="omnibox-kbd">Ctrl + K</span>
      <div id="omnibox-results" class="omnibox-dropdown hidden"></div>
    </div>

    <!-- ACCIONES SUPERIORES -->
    <div class="header-actions">
      <button id="btn-create-rp-top" class="btn btn-sm" title="Crear Punto de Restauración del Sistema ahora">
        Punto de restauración
      </button>
      <button id="btn-ota-check" class="btn btn-sm" style="border-color: var(--accent); color: var(--accent);">
        Actualizaciones
      </button>
      <button id="btn-theme-toggle" class="btn btn-sm" title="Alternar Modo Oscuro / Modo Claro">
        Modo claro
      </button>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL -->
  <div class="app-body">
    <!-- BARRA LATERAL POR CATEGORÍAS Y SUBCATEGORÍAS -->
    <aside class="sidebar" aria-label="Módulos de Blackwall">
      <div>
        <button id="btn-sidebar-toggle" class="btn sidebar-toggle" aria-expanded="true" aria-controls="sidebar-nav">☰ <span class="nav-label">Contraer menú</span></button>
        <nav id="sidebar-nav" aria-label="Secciones">
        <div class="nav-group-label">Diagnóstico</div>
        <button class="nav-btn active" data-tab="hardware" aria-current="page">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H4z M8 20h8 M12 16v4" /></svg><span class="nav-label">Hardware</span></span>
          <span class="nav-badge">WMI/SMART</span>
        </button>

        <div class="nav-group-label">Configuración</div>
        <button class="nav-btn" data-tab="optimization">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17l5-6 4 3 7-9 M15 5h5v5" /></svg><span class="nav-label">Rendimiento</span></span>
          <span id="badge-opt-count" class="nav-badge">—</span>
        </button>
        <button class="nav-btn" data-tab="debloat">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 4v5c0 5-8 9-8 9s-8-4-8-9V7z" /></svg><span class="nav-label">Privacidad</span></span>
          <span id="badge-debloat-count" class="nav-badge">—</span>
        </button>

        <div class="nav-group-label">Herramientas</div>
        <button class="nav-btn" data-tab="apps">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4z M3 7l9 4 9-4 M12 11v10" /></svg><span class="nav-label">Software</span></span>
          <span id="badge-apps-count" class="nav-badge">—</span>
        </button>
        <button class="nav-btn" data-tab="monitor">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4" /></svg><span class="nav-label">Procesos</span></span>
          <span id="badge-scripts-count" class="nav-badge">WMI</span>
        </button>

        <div class="nav-group-label">Recuperación</div>
        <button class="nav-btn" data-tab="safety">
          <span><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10h12v11H6z M8 10V7a4 4 0 018 0v3" /></svg><span class="nav-label">Seguridad</span></span>
          <span class="nav-badge">RESTORE</span>
        </button>
        </nav>
      </div>

      <div>
      <button id="btn-motion-toggle" class="btn motion-toggle" aria-pressed="false">Animaciones activas</button>
      <div class="sidebar-footer">
        <div class="eyebrow">MURO NEGRO</div>
        <div id="app-version">PORTABLE / WINDOWS 10 · 11</div>
      </div>
      </div>
    </aside>

    <!-- ÁREA CENTRAL DINÁMICA -->
    <main id="main-view" class="main-content" tabindex="-1">
      <!-- Renderizado dinámico por módulo -->
    </main>
  </div>

  <!-- BARRA INFERIOR DE ESTADO Y PROGRESO -->
  <footer class="status-footer">
    <div style="display:flex; align-items:center; gap:12px;">
      <span class="status-dot" aria-hidden="true"></span><span id="status-indicator" role="status">Interfaz lista</span>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span id="active-task-label" style="color:var(--text-secondary);">Sin tareas en cola</span>
      <button id="btn-jump-console" class="btn btn-sm">Abrir consola </button>
    </div>
  </footer>

  <div id="operation-rail" class="operation-rail hidden" role="status" aria-live="polite">
    <div><span id="operation-label"></span><span id="operation-count"></span></div>
    <progress aria-label="Operaciones del sistema en curso"></progress>
  </div>

  <section id="error-panel" class="error-panel hidden" role="alert" aria-labelledby="error-title">
    <div class="error-header"><span class="eyebrow">ATENCIÓN / OPERACIÓN INTERRUMPIDA</span><button id="btn-error-dismiss" class="btn btn-sm" aria-label="Cerrar aviso de error">×</button></div>
    <h2 id="error-title"></h2><p id="error-detail"></p>
    <button id="btn-error-retry" class="btn btn-danger">Intentar de nuevo ↻</button>
  </section>

  <!-- MODAL DE ACTUALIZACIÓN REMOTA OTA CON CONSENTIMIENTO -->
  <div id="ota-modal" class="modal-backdrop hidden">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Actualización remota">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size:17px;">Actualización de Blackwall</h3>
        <span class="risk-badge risk-medium">Requiere verificación</span>
      </div>
      <div id="ota-modal-body" style="font-size:13px; color:var(--text-secondary); line-height:1.5;"></div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:6px;">
        <button id="btn-ota-postpone" class="btn">Posponer</button>
        <button id="btn-ota-confirm" class="btn btn-primary"> Actualizar Binario y Catálogos Ahora</button>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
